# Misma topología que docker-compose.yml, pero en vez de CONSTRUIR las imágenes
# las DESCARGA del registry. Sirve para levantar el sistema en una máquina que no
# tiene el código — que es exactamente lo que van a hacer los entornos de QA y
# producción del TP6, y lo que consume el pipeline del TP7.
#
# Lo único que cambia son las dos líneas donde el otro decía `build:`.
#
# Uso:  cp .env.example .env  &&  docker compose -f docker-compose.registry.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: inventario
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventario"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/marcosdon28/inventario-backend:v0.1.0    # antes: build: ./backend
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:${DB_PASSWORD}@db:5432/inventario"
      DESCUENTO_CANTIDAD_MINIMA: "10"
      DESCUENTO_PORCENTAJE: "10"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/marcosdon28/inventario-frontend:v0.1.0   # antes: build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
