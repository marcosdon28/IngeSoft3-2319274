server {
    listen 80;

    # SPA: sirve los estáticos, con fallback a index.html.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # El frontend llama a /api/... con ruta RELATIVA: no sabe dónde vive el
    # backend. Quien traduce esa ruta es Vite en desarrollo y nginx acá.
    # Como para el browser todo sale del mismo origen, NO hay CORS que configurar.
    #
    # El nombre del servicio va en una VARIABLE, no escrito directo en proxy_pass:
    # con el nombre directo nginx lo resuelve AL ARRANCAR y, si el backend
    # todavía no existe, se niega a levantar («host not found in upstream»).
    # Con variable, resuelve recién cuando llega un pedido.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_api http://backend:8000;

    location /api/ {
        # SIN barra al final: con barra, nginx reescribiría /api/productos
        # como /productos y la API devolvería 404 en todas las llamadas.
        proxy_pass $backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
