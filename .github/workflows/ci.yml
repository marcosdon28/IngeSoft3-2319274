name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # deja la corrida de main que lee el badge, y su cache

jobs:
  # Los dos jobs corren EN PARALELO, cada uno en su propio runner limpio.
  # No comparten filesystem: son dos máquinas distintas.
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          # En un PR, GITHUB_REF_NAME vale "<numero>/merge" —GitHub construye la
          # mezcla de la rama con main—, así que la rama real sale de head_ref.
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del backend
        # El pipeline NO compila por su cuenta: usa el Dockerfile del TP2, que es
        # la misma definición de build que después se despliega.
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false                    # todavía no se publica: eso es el TP6
          tags: inventario-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ---- TP5: los tests corren ADENTRO del contenedor, en la etapa `test` ----
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test          # se detiene en la etapa de tests, no llega a final
          load: true            # deja la imagen en el Docker local, para poder correrla
          push: false
          tags: backend-test:ci
          # estante de cache PROPIO: son cuatro builds distintos en el repo
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        # El ENTRYPOINT de la etapa es pytest con --cov y --cov-fail-under: si un
        # test falla O la cobertura no llega al umbral, el docker run devuelve
        # error y el job queda rojo. /out se monta para sacar el reporte afuera.
        run: docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      - name: Resumen de coverage del backend
        if: ${{ !cancelled() }}        # también cuando los tests fallaron: es la corrida que se entrega
        run: |
          test -f TestResults/coverage.xml     # si no está, el paso FALLA: mejor rojo que un resumen vacío
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("TestResults/coverage.xml").getroot()
          lineas, ramas = float(r.get("line-rate")) * 100, float(r.get("branch-rate")) * 100
          if int(r.get("lines-valid", "0")) == 0:
              raise SystemExit("midió 0 líneas: revisar source/omit de .coveragerc")
          print("### Coverage del backend (pytest-cov)")
          print("| métrica | % |"); print("|---|---|")
          print(f"| líneas | {lineas:.1f} % |"); print(f"| ramas | {ramas:.1f} % |")
          print(f"| umbral (combinada, --cov-fail-under) | 85 % |")
          PY

      - name: Publicar coverage y resultados del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            TestResults/htmlcov
            TestResults/coverage.xml
            TestResults/tests.xml

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      - name: Construir la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: inventario-frontend:ci
          # scope distinto por job: sin esto los dos comparten estante y se pisan,
          # y cuál queda cacheado cambia según cuál termine último.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ---- TP5: misma receta que el backend ----
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        # vitest evalúa coverage.thresholds sólo con --coverage (lo pide test:ci):
        # por debajo del umbral sale con error aunque todos los tests pasen.
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen de coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # si no está, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisar el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct} % |\`;
            console.log('### Coverage del frontend (vitest + v8)');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
            console.log('| umbral (thresholds) | líneas 90 % · ramas 85 % |');
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage
