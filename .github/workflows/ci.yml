name: CI

on:
  pull_request:
    branches: [main]      # el que hace el trabajo: verifica ANTES del merge
  push:
    branches: [main]      # deja la corrida de main que lee el badge, y su cache

jobs:
  # Los dos jobs corren EN PARALELO, cada uno en su propio runner limpio.
  # No comparten filesystem: son dos máquinas distintas.
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # sin esto el checkout no puede leer el código
      packages: write     # publicar en ghcr.io con el GITHUB_TOKEN de la corrida
    steps:
      - name: Qué estamos verificando
        env:
          # En un PR, GITHUB_REF_NAME vale "<numero>/merge" —GitHub construye la
          # mezcla de la rama con main—, así que la rama real sale de head_ref.
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # ---- TP5: los tests corren ADENTRO del contenedor, en la etapa `test` ----
      - name: Construir la etapa de tests del backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: test          # se detiene en la etapa de tests, no llega a final
          load: true            # deja la imagen en el Docker local, para poder correrla
          push: false
          tags: backend-test:ci
          # estante de cache PROPIO: son cuatro builds distintos en el repo
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Correr los tests del backend con coverage
        # El ENTRYPOINT de la etapa es pytest con --cov y --cov-fail-under: si un
        # test falla O la cobertura no llega al umbral, el docker run devuelve
        # error y el job queda rojo. /out se monta para sacar el reporte afuera.
        run: docker run --rm -v "${{ github.workspace }}/TestResults:/out" backend-test:ci

      - name: Resumen de coverage del backend
        if: ${{ !cancelled() }}        # también cuando los tests fallaron: es la corrida que se entrega
        run: |
          test -f TestResults/coverage.xml     # si no está, el paso FALLA: mejor rojo que un resumen vacío
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          r = ET.parse("TestResults/coverage.xml").getroot()
          lineas, ramas = float(r.get("line-rate")) * 100, float(r.get("branch-rate")) * 100
          if int(r.get("lines-valid", "0")) == 0:
              raise SystemExit("midió 0 líneas: revisar source/omit de .coveragerc")
          print("### Coverage del backend (pytest-cov)")
          print("| métrica | % |"); print("|---|---|")
          print(f"| líneas | {lineas:.1f} % |"); print(f"| ramas | {ramas:.1f} % |")
          print(f"| umbral (combinada, --cov-fail-under) | 85 % |")
          PY

      - name: Publicar coverage y resultados del backend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-backend
          path: |
            TestResults/htmlcov
            TestResults/coverage.xml
            TestResults/tests.xml

      # ---- TP6: el artefacto. ÚLTIMO paso a propósito: si los tests o el umbral
      # fallan, el job muere antes y esto nunca corre. La condición no está
      # escrita en un `if`: está en el ORDEN de los pasos. ----
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # el token de la corrida: vive lo que dura el job

      - name: Construir y publicar la imagen del backend
        # El pipeline NO compila por su cuenta: usa el Dockerfile del TP2, que es
        # la misma definición de build que después se despliega. Publica SÓLO en
        # el push a main (las dos condiciones, no una): los PRs construyen y
        # verifican, pero no suben nada. Etiqueta = el commit que la produjo.
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # el nombre va escrito a mano y en minúsculas: github.repository tiene mayúsculas
          tags: ghcr.io/marcosdon28/inventario-backend:sha-${{ github.sha }}
          build-args: APP_COMMIT=${{ github.sha }}   # /health lo devuelve: el smoke lo compara
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # sin esto el checkout no puede leer el código
      packages: write     # publicar en ghcr.io con el GITHUB_TOKEN de la corrida
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # ---- TP5: misma receta que el backend ----
      - name: Construir la etapa de tests del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: test
          load: true
          push: false
          tags: frontend-test:ci
          cache-from: type=gha,scope=frontend-test
          cache-to: type=gha,mode=max,scope=frontend-test

      - name: Correr los tests del frontend con coverage
        # vitest evalúa coverage.thresholds sólo con --coverage (lo pide test:ci):
        # por debajo del umbral sale con error aunque todos los tests pasen.
        run: |
          docker run --rm -e COVERAGE_DIR=/salida/reporte \
            -v "${{ github.workspace }}/frontend-coverage:/salida" frontend-test:ci

      - name: Resumen de coverage del frontend
        if: ${{ !cancelled() }}
        run: |
          F=frontend-coverage/reporte/coverage-summary.json
          test -f "$F"          # si no está, el paso FALLA: mejor rojo que un resumen vacío
          node -e "
            const t = require('./$F').total;
            if (!t.lines.total) { console.error('midio 0 archivos: revisar el include'); process.exit(1); }
            const f = (m) => \`| \${m} | \${t[m].pct} % |\`;
            console.log('### Coverage del frontend (vitest + v8)');
            console.log('| métrica | % |'); console.log('|---|---|');
            console.log(f('lines')); console.log(f('branches')); console.log(f('functions'));
            console.log('| umbral (thresholds) | líneas 90 % · ramas 85 % |');
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el coverage del frontend
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: coverage-frontend
          path: frontend-coverage

      # ---- TP6: el artefacto, último paso (ver el comentario del backend) ----
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen del frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/marcosdon28/inventario-frontend:sha-${{ github.sha }}
          # scope distinto por job: sin esto los dos comparten estante y se pisan,
          # y cuál queda cacheado cambia según cuál termine último.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ---- TP6: la promoción arranca donde termina la verificación ----
  deploy-qa:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]     # sin CI verde no hay deploy
    if: github.ref == 'refs/heads/main'        # los PRs verifican; sólo main despliega
    environment: qa                            # hereda sus secrets y variables, y suma al historial
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      # El deploy lo dispara el PIPELINE (Auto-Deploy de Render está apagado),
      # por la API de Render y con el commit EXPLÍCITO: se despliega lo que esta
      # corrida verificó, no la punta de la rama. Con dos merges seguidos, sin
      # esto la corrida de A desplegaría B. El script espera a que cada deploy
      # figure `live` y falla si el build de Render falla: el smoke de abajo
      # corre contra la versión nueva, no contra la anterior.
      # Credencial: secret del environment. Ids de servicio: variables del environment.
      # TP7: los servicios de Render EJECUTAN la imagen del registry (ya no
      # reconstruyen). Se les dice QUÉ imagen: la sha-<commit> que este mismo
      # workflow publicó. Lo que corre es, bit a bit, lo que se verificó.
      - name: Desplegar en Render (api + front) la IMAGEN del commit verificado
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          ./scripts/render-deploy.sh "${{ vars.RENDER_SERVICE_API }}"   "ghcr.io/marcosdon28/inventario-backend:sha-$GITHUB_SHA"
          ./scripts/render-deploy.sh "${{ vars.RENDER_SERVICE_FRONT }}" "ghcr.io/marcosdon28/inventario-frontend:sha-$GITHUB_SHA"

      - name: Smoke test (espera a que QA conteste)
        shell: bash
        env:
          URL_API: https://inventario-api-qa.onrender.com
          URL_FRONT: https://inventario-front-qa.onrender.com
        run: |
          echo "Esperando a que QA esté vivo..."
          for i in $(seq 1 30); do
            # --max-time en CADA curl: un servicio despertando acepta la conexión y
            # no contesta; sin tope, curl se queda colgado hasta que muera el job.
            # Tres cosas: /health (proceso vivo), /api/productos (la BASE responde)
            # y el front servido.
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/productos" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              # Responde. Y ¿corre ESTE commit? Lo dice /health (ARG APP_COMMIT de la imagen).
              CORRE=$(curl -fsS --max-time 10 "$URL_API/health" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit"))')
              if [ "$CORRE" = "$GITHUB_SHA" ]; then
                echo "✅ QA responde (API + BD + front) y corre $CORRE — vuelta $i"; exit 0
              fi
              echo "   QA responde pero corre $CORRE, no $GITHUB_SHA: espero…"
            fi
            sleep 20
          done
          echo "❌ QA no respondió a tiempo"; exit 1

  # ---- TP7: las pruebas como gate de promoción. QA ya ejecuta la imagen de
  # ESTA corrida; primero la api con su base (integración), después un navegador
  # real (e2e). PROD sólo si las dos pasan. ----
  integracion:
    runs-on: ubuntu-latest
    needs: deploy-qa                       # QA ya está ejecutando la imagen de ESTA corrida
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install (sin browser)
        run: npm ci                        # sin `playwright install`: estas pruebas no abren navegador
        working-directory: ./frontend

      - name: Integración contra la api de QA
        env:
          API_BASE_URL: https://inventario-api-qa.onrender.com    # la api, no el front
        run: npx playwright test e2e/api.spec.js
        working-directory: ./frontend

      - name: Publicar reporte de integración
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}            # el reporte importa MÁS cuando falla
        with:
          name: playwright-report-integracion   # distinto del de e2e: dos iguales rompen la corrida
          path: frontend/playwright-report
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: integracion                     # si la api está rota, no gastamos un browser en confirmarlo
    timeout-minutes: 20                    # si algo se cuelga, el job muere en vez de esperar horas
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install + browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
        working-directory: ./frontend

      - name: e2e contra QA
        env:
          E2E_BASE_URL: https://inventario-front-qa.onrender.com   # el front de QA
          API_BASE_URL: https://inventario-api-qa.onrender.com     # para armar y limpiar los datos propios
        run: npx playwright test e2e/inventario.spec.js   # SU archivo: sin esto vuelve a correr la integración
        working-directory: ./frontend

      - name: Publicar reporte e2e
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-e2e
          path: frontend/playwright-report
          retention-days: 7

  # ---- TP6: el gate humano. PROD sólo después de QA vivo y con aprobación ----
  deploy-prod:
    runs-on: ubuntu-latest
    needs: e2e                                  # EL gate: sin integración y e2e verdes, ni siquiera se pide aprobación
    # No repite el `if` de la rama: depende de deploy-qa, que sí lo tiene; en un
    # PR ninguno de los dos corre. La condición se hereda por la cadena.
    environment: production                     # ⏸ acá el workflow SE PAUSA hasta el approve
    # Dos deploys a PROD nunca a la vez. Ojo: NO ordena la cola de aprobaciones —una
    # corrida vieja esperando aprobación no está "en cola"—: eso se rechaza a mano.
    concurrency: { group: deploy-prod, cancel-in-progress: false }
    steps:
      - name: Bajar el código al runner
        uses: actions/checkout@v6

      # Entre que la corrida queda esperando aprobación y que alguien la aprueba
      # pueden pasar horas, y `main` se mueve. El commit va explícito: el
      # aprobador firma exactamente lo que se despliega. Los ids y la credencial
      # salen del environment `production`: sin aprobación, nadie los lee.
      # TP7: los servicios de Render EJECUTAN la imagen del registry (ya no
      # reconstruyen). Se les dice QUÉ imagen: la sha-<commit> que este mismo
      # workflow publicó. Lo que corre es, bit a bit, lo que se verificó.
      - name: Desplegar en Render (api + front) la IMAGEN del commit aprobado
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          ./scripts/render-deploy.sh "${{ vars.RENDER_SERVICE_API }}"   "ghcr.io/marcosdon28/inventario-backend:sha-$GITHUB_SHA"
          ./scripts/render-deploy.sh "${{ vars.RENDER_SERVICE_FRONT }}" "ghcr.io/marcosdon28/inventario-frontend:sha-$GITHUB_SHA"

      - name: Smoke test PROD
        shell: bash
        env:
          URL_API: https://inventario-api-prod-7xrj.onrender.com
          URL_FRONT: https://inventario-front-prod.onrender.com
        run: |
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "$URL_API/health" \
               && curl -fsS --max-time 10 "$URL_API/api/productos" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              # Responde. Y ¿corre ESTE commit? Lo dice /health (ARG APP_COMMIT de la imagen).
              CORRE=$(curl -fsS --max-time 10 "$URL_API/health" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit"))')
              if [ "$CORRE" = "$GITHUB_SHA" ]; then
                echo "✅ PROD responde (API + BD + front) y corre $CORRE — vuelta $i"; exit 0
              fi
              echo "   PROD responde pero corre $CORRE, no $GITHUB_SHA: espero…"
            fi
            sleep 20
          done
          echo "❌ PROD no respondió a tiempo"; exit 1
